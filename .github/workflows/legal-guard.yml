name: Legal-Guard

# Statischer Regressions-Check gegen typische Abmahn-Gründe (Abmahn-Check 13.06.2026):
#   • toter EU-OS-Plattform-Link (Plattform zum 20.07.2025 eingestellt)
#   • extern nachladende Google Fonts (müssen self-hosted via next/font sein)
#   • einwilligungspflichtige Tracker ohne Consent (Seite ist cookieless)
#   • Affiliate-Links ohne sichtbare „Anzeige"-Kennzeichnung / ohne rel="sponsored"
# Regeln + Begründung je Punkt: compliance/website-rechtscheck.yaml
# Läuft schnell: statt eines vollen `npm ci` wird nur js-yaml geholt — das ist
# die einzige Abhängigkeit des Skripts (seit Regel 6, liest data/bildregister.yaml).
# Bei Verstoß: rot. Blockiert NICHT den Deploy (läuft parallel) — Frühwarn-Signal.
#
# 01.09.2026: Der Job lief von 077d0e8 (31.08., 08:36) bis hierher in JEDEM Lauf
# rot — ERR_MODULE_NOT_FOUND auf js-yaml, Abbruch nach 14 s, bevor eine einzige
# Regel geprüft wurde. Regel 6 hatte den Import gebracht, der Workflow blieb auf
# der Annahme "reines Node-Skript ohne Install" stehen. Zehn rote Läufe in Folge,
# auch auf main. Wer hier künftig eine Abhängigkeit ergänzt, ergänzt sie auch im
# Install-Schritt unten — sonst prüft der Guard wieder nichts und sagt es nicht.
#
# Trigger: Push auf main + jeder PR. Ursprünglich lief der Guard auf allen
# Branches (d3ac137); das kostet bei täglicher Arbeit einen CI-Lauf pro Push,
# ohne mehr abzufangen — was per PR kommt, wird ohnehin geprüft, und was direkt
# auf main landet, ebenfalls. Ein zeitgesteuerter Cron wäre redundant, weil der
# Check rein statisch ist (gleicher Code = gleiches Ergebnis).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Doppelläufe (Push + PR auf demselben Branch) sauber zusammenfassen.
concurrency:
  group: legal-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Abmahn-Regressionen prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Kein volles `npm ci`: der Guard braucht genau ein Paket, und der Job soll
      # in Sekunden durch sein. Die Version kommt exakt aus package-lock.json, nicht
      # aus dem Range in package.json — ein Rechts-Check soll bei gleichem Commit
      # dasselbe Ergebnis liefern und nicht davon abhaengen, welche Minor-Version
      # die Registry heute ausliefert. Fallback auf den Range, falls das Lockfile
      # den Eintrag mal nicht in dieser Form fuehrt.
      - name: js-yaml bereitstellen
        run: |
          VERSION=$(node -p "const l=require('./package-lock.json'); (l.packages && l.packages['node_modules/js-yaml'] && l.packages['node_modules/js-yaml'].version) || require('./package.json').dependencies['js-yaml']")
          echo "js-yaml@$VERSION"
          npm install "js-yaml@$VERSION" --no-save --no-audit --no-fund --loglevel=error

      - name: Legal-Guard ausführen
        run: |
          set +e
          OUT=$(node scripts/legal-guard.mjs 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "## ⚖️ Legal-Guard"
            echo ""
            echo '```'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE
