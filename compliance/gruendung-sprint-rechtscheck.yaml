# ─────────────────────────────────────────────────────────────────────────────
# Gründung-Sprint — Rechts-Check-Komponenten (Kunden-Audit)
# ─────────────────────────────────────────────────────────────────────────────
# Wiederverwendbare Prüf-Checkliste für die NEUE Website des Gründer-Kunden im
# Gründung-Sprint (Produkt F). Spiegelt 1:1 die 18 Komponenten des ARAG-
# Homepagechecks — so liefert der Sprint genau die Punkte ab, gegen die ein
# offizielles Anwalts-Testat prüft.
#
# Unterschied zum Self-Audit (website-rechtscheck.yaml): Gründer-Sites haben
# typischerweise MEHR aktive Komponenten (Shop/Zahlung, oft Cookie-Banner,
# evtl. Google-Embeds) → diese Punkte sind hier KEINE "not-applicable"-Defaults,
# sondern müssen je Kundensite einzeln bewertet werden.
#
# status je Kunde: open | ok | fix-needed | not-applicable
# Letzte Aktualisierung: 2026-08-10 (Rechts-Update-Scan: § 356a BGB in Kraft,
#   UWG/EmpCo-Novelle ab 27.09.2026 als eigene Komponente ergänzt)

version: 3
zweck: "Rechts-Check-Modul des Gründung-Sprint (Produkt F)"
hinweis: "Keine Rechtsberatung — strukturierte Vorprüfung. Bei Unsicherheit Anwalt (Kunde hat ggf. Rechtsschutz)."
standComponents: "2026-06-05"

# Reihenfolge = Abarbeitung im Sprint
komponenten:
  - id: domain-kennzeichenrecht
    titel: "Namens- & Kennzeichenrechte der Domain/Marke"
    pruefung: "DPMA-/TMview-Abgleich: kollidiert Domain/Name mit fremder Marke?"
    rechtsgrundlage: "MarkenG §§ 5, 15; § 12 BGB"
    sprint-aktion: "Vor Domain-Kauf prüfen; bei Treffer alternativen Namen wählen."
    status: open

  - id: haftung-externe-links
    titel: "Haftung für externe Links"
    pruefung: "Disclaimer + keine Links auf rechtswidrige Inhalte"
    rechtsgrundlage: "§ 8 TMG/DDG"
    sprint-aktion: "Standard-Haftungsausschluss in DSE/Impressum aufnehmen."
    status: open

  - id: urheberrecht-texte-bilder
    titel: "Urheberrecht Texte & Bilder"
    pruefung: "Alle Medien lizenziert/eigen; Stockfoto-Lizenzen dokumentiert; KI-Bilder ok"
    rechtsgrundlage: "UrhG §§ 2, 19a, 72"
    sprint-aktion: "Kunde: nur eigene/lizenzierte/CC0-Bilder. Keine Google-Bilder."
    status: open

  - id: impressum-ddg
    titel: "Impressum § 5 DDG (2-Klick erreichbar)"
    pruefung: "Vollständig (Name, Anschrift, Kontakt, ggf. USt-ID/Register); max. 2 Klicks"
    rechtsgrundlage: "§ 5 DDG; BGH I ZR 228/03"
    sprint-aktion: "Impressum-Generator + Footer-Link auf jeder Seite."
    status: open

  - id: dse-speicherdauer-loeschfristen
    titel: "DSE: konkrete Speicherdauer / Löschfristen"
    pruefung: "Je Verarbeitung Frist/Kriterium angeben (häufigster Testat-Mangel!)"
    rechtsgrundlage: "Art. 13 Abs. 2 lit. a DSGVO"
    sprint-aktion: "Pro Dienst konkrete Frist eintragen — Vorlage aus Steakakademie-DSE nutzen."
    status: open

  - id: widerrufs-rueckgaberecht
    titel: "Widerrufs- & Rückgaberecht (+ Widerrufsbutton)"
    pruefung: >-
      §§ 312 ff BGB bei Verkauf an Verbraucher; elektronische Widerrufsfunktion nach § 356a BGB
      IST SEIT 19.06.2026 IN KRAFT (nicht mehr 'ab'): Schaltfläche 'Vertrag widerrufen' gut sichtbar
      und leicht zugänglich, zweistufige Bestätigung, unverzügliche Eingangsbestätigung mit Datum
      und Uhrzeit auf dauerhaftem Datenträger. Keine Branchenausnahme — gilt auch für digitale
      Dienstleistungen, Finanzdienstleistungen und Versicherungsverträge.
    rechtsgrundlage: "§§ 312 ff, 356a BGB; Art. 246a EGBGB; RL (EU) 2023/2673 (Umsetzungsgesetz BGBl. 05.02.2026)"
    sprint-aktion: >-
      Nur falls Kunde an Verbraucher verkauft — dann PFLICHT, kein Nice-to-have.
      Muster-Widerrufsbelehrung + Widerrufsseite + Footer-Button + automatische Eingangsbestätigung
      per Mail. Vorlage: Steakakademie /widerruf + AGB §§ 6/6a/6b.
    status: open

  - id: preisangaben-pangv
    titel: "Preisangabenverordnung"
    pruefung: "Gesamtpreis inkl. USt, Grundpreis, Versand"
    rechtsgrundlage: "PAngV §§ 3, 4"
    sprint-aktion: "Nur bei Shop/Preisen relevant."
    status: open

  - id: dse-ssl-tls
    titel: "SSL/TLS aktiv + in DSE genannt"
    pruefung: "HTTPS erzwungen; Erwähnung in DSE"
    rechtsgrundlage: "Art. 32 DSGVO"
    sprint-aktion: "Hosting mit Auto-TLS (Netlify/Vercel) → automatisch erfüllt."
    status: open

  - id: dse-datensparsamkeit
    titel: "Datensparsamkeit"
    pruefung: "Nur nötige Felder in Formularen; keine Daten ohne Zweck"
    rechtsgrundlage: "Art. 5 Abs. 1 lit. c DSGVO"
    status: open

  - id: dse-cookies-consent
    titel: "Cookies & Consent-Banner"
    pruefung: "Banner mit GLEICHWERTIGEM Ablehnen-Button + Widerruf-Link, falls einwilligungspflichtige Cookies"
    rechtsgrundlage: "§ 25 TDDDG; Art. 7 Abs. 3 DSGVO"
    sprint-aktion: "EMPFEHLUNG: cookieless starten (Plausible) → kein Banner. Sonst Consent-Tool (Cookiebot/Usercentrics) mit gleichwertigem Ablehnen."
    status: open

  - id: dse-social-media-plugins
    titel: "Social-Media-Plug-Ins"
    pruefung: "Echte Plug-ins datenschutzkonform (2-Klick/Shariff) — oder nur Links"
    rechtsgrundlage: "Art. 6, 26 DSGVO"
    sprint-aktion: "EMPFEHLUNG: nur Profil-Links statt Plug-ins → kein Problem."
    status: open

  - id: dse-eingebettete-dienste
    titel: "Eingebettete Dienste (YouTube, Maps, Fonts)"
    pruefung: "Bei Embeds: Drittlandtransfer (DPF/SCC) + Widerspruch + Anbieter-DS verlinken; Consent vor Laden"
    rechtsgrundlage: "Art. 44 ff DSGVO; § 25 TDDDG"
    sprint-aktion: "EMPFEHLUNG: YouTube-nocookie + Klick-to-load; Maps statisch/verlinkt."
    status: open

  - id: dse-ip-logfiles-anonym
    titel: "IP-Adressen / Logfiles anonymisiert"
    pruefung: "Serverlogs nur anonymisiert/kurzfristig"
    rechtsgrundlage: "Art. 5, 32 DSGVO"
    status: open

  - id: dse-auftragsverarbeitung
    titel: "Auftragsverarbeitung benennen"
    pruefung: "Alle AV (Hosting, CDN, Mail, DB, KI, Payment) in DSE genannt + AV-Verträge"
    rechtsgrundlage: "Art. 13 Abs. 1 lit. e, Art. 28 DSGVO"
    sprint-aktion: "Checkliste: jeden eingesetzten Dienst benennen (häufiger Testat-Mangel)."
    status: open

  - id: dse-zahlungsdienstleister
    titel: "Zahlungsdienstleister"
    pruefung: "Provider (PayPal, Stripe, Digistore24…) benannt + datensparsam"
    rechtsgrundlage: "Art. 6 Abs. 1 lit. b DSGVO"
    sprint-aktion: "Nur falls Zahlungen. Provider-Block in DSE."
    status: open

  - id: dse-statistik-analyse-tools
    titel: "Statistik-/Analysetools"
    pruefung: "IP anonym + Opt-out; bei GA4: Consent zwingend"
    rechtsgrundlage: "§ 25 TDDDG; Art. 6 DSGVO"
    sprint-aktion: "EMPFEHLUNG: Plausible (cookielos) statt GA4 → kein Consent nötig."
    status: open

  - id: dse-marketing-affiliate-tools
    titel: "Marketing-/Affiliate-Tools"
    pruefung: "Google Ads/AWIN etc.: Consent + Opt-out; Programme benennen"
    rechtsgrundlage: "§ 25 TDDDG; Art. 6 DSGVO"
    sprint-aktion: "Nur falls eingesetzt. Affiliate-Disclosure-Seite anlegen."
    status: open

  - id: google-fonts-selfhosted
    titel: "Google Fonts self-hosted"
    pruefung: "Keine extern nachladenden Google-Fonts"
    rechtsgrundlage: "LG München 3 O 17493/20"
    sprint-aktion: "next/font o. lokale Einbindung → kein externer Request."
    status: open

  # ── Neu 05.06.2026: nur relevant, wenn die Kundensite nutzergenerierte
  #    Inhalte (Bewertungen, Kommentare, Uploads, Community-Beiträge) ODER
  #    KI-generierte Bilder/Texte zeigt. Sonst not-applicable. ──
  - id: ugc-und-ki-inhalte
    titel: "Nutzergenerierte Inhalte (UGC) & KI-generierte Medien"
    pruefung: "Bei UGC: Rechteeinräumung + Rechte-Zusicherung + Freistellung in AGB; Einwilligung zur Anzeige von Namen/Profil (keine PII-Veröffentlichung ohne Einwilligung); Host-Privileg §§7ff DDG + Melde-/Löschweg. Bei KI-Medien: sichtbare Kennzeichnung KI-erzeugter Bilder/Texte; eingesetzte KI-Dienste als AV in DSE benennen (Art.28/SCC)."
    rechtsgrundlage: "UrhG § 31; DSGVO Art. 6 Abs. 1 lit. a/f, Art. 13, Art. 28; §§ 7 ff. DDG; § 5 UWG; EU-AI-Act Art. 50"
    sprint-aktion: "Falls UGC: Einwilligungs-Checkbox am Einreichpunkt (Rechteeinräumung + Namens-Einwilligung, Link AGB/DSE) + AGB-§ UGC + Backend erzwingt Einwilligung; kein E-Mail-Lokalteil als öffentlicher Name. Falls KI-Bilder/-Texte: sichtbares 'KI'-/'KI-Symbolbild'-Badge + KI-Dienst in DSE. Vorlage: Steakakademie AGB §13 / DSE §10a (Self-Audit, Commit fec7e95)."
    status: open

  # ── Neu 10.08.2026: UWG-Novelle (EmpCo-Umsetzung), in Kraft 27.09.2026 ──────
  #    Für Kundensites regelmäßig RELEVANTER als für die Steakakademie selbst —
  #    Gründer werben häufig mit 'nachhaltig', 'klimaneutral', 'öko', Siegeln.
  - id: green-claims-empco
    titel: "Umweltbezogene Werbeaussagen & Nachhaltigkeitssiegel"
    pruefung: >-
      Keine pauschalen Umweltaussagen ohne belastbaren Nachweis ('nachhaltig', 'umweltfreundlich',
      'klimaneutral', 'öko', 'grün', 'CO2-neutral'); Kompensations-Claims allein über CO2-Zertifikate
      unzulässig; Nachhaltigkeitssiegel nur bei zertifiziertem System oder behördlicher Einführung;
      Aussagen zu künftiger Umweltleistung nur mit konkretem, überprüfbarem Umsetzungsplan.
    rechtsgrundlage: >-
      §§ 2, 5, 5b UWG + Anhang zu § 3 Abs. 3 UWG i.d.F. des Dritten Gesetzes zur Änderung des UWG
      (BGBl. v. 19.02.2026), in Kraft 27.09.2026; RL (EU) 2024/825 (EmpCo)
    sprint-aktion: >-
      Kundentexte gegen Umweltclaims scannen. Jeden Claim entweder belegen (Zertifikat/Studie
      verlinken, Bezugspunkt nennen) oder streichen. Selbst erfundene 'Siegel'/Grafiken entfernen.
      Bußgeldrisiko bis 4 % Jahresumsatz + Abmahnung — für einen Gründer existenzbedrohend.
    status: open
