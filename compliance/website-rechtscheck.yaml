# ─────────────────────────────────────────────────────────────────────────────
# Rechtssicherheit-Agent — Check-Komponenten-Katalog (Self-Audit)
# ─────────────────────────────────────────────────────────────────────────────
# Wird von Agent 1 (AGB-Compliance-Scanner) + Agent 8 (Rechts-Update-Scanner)
# gelesen. Der Agent prüft steakakademie.de gegen JEDE hier gelistete Komponente
# und schreibt das Ergebnis in seinen Report.
#
# Quellen der Komponenten:
#   - ARAG Homepagecheck (RA Dr. Fröhlich, 02.06.2026) — Punkte 1–18
#   - Bisherige Agent-1/Agent-8-Prüfpunkte (robots.txt, Schema.org, Rechts-Updates)
#   - Abmahn-Check der Gesamtsite (13.06.2026) — Werbekennzeichnung (§5a UWG),
#     Newsletter-Double-Opt-In (§7 UWG), Health-Claims (HCVO/LFGB/§5 UWG),
#     Tracking-Code-Scan (§25 TDDDG). Dieser Katalog ist damit die EINE
#     vereinheitlichte SSoT für ARAG-Testat-Punkte UND Abmahn-Prävention.
#
# Feld-Legende:
#   herkunft   : woher die Komponente stammt (arag-#N | agent-bestand)
#   neu        : true = durch ARAG-Auswertung NEU in den Agenten aufgenommen
#   pruefung   : was der Agent konkret prüft
#   rechtsgrundlage
#   status     : ok | fix-needed | not-applicable | monitor
#   befund     : aktueller Stand steakakademie.de (Stand 02.06.2026)
# Letzte Aktualisierung: 2026-06-13 (Self-Audit: 7 fix-needed-Punkte aus dem
# Tiefen-Check 07.06. gegen den aktuellen Code verifiziert → alle umgesetzt,
# Implementierung in Commit 968e835 (UGC/DSA/Gutschein/DSE) + a476b51 (AGB→main))

