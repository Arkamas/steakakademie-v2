name: 'PR statt Push'
description: >
  Committet Änderungen auf einen eigenen Branch und öffnet einen Pull Request nach
  main — statt direkt zu pushen. Seit 01.09.2026 blockiert Branch Protection jeden
  Direct-Push auf main; die Bot-Workflows liefen seitdem ins Leere (letzter Bot-Commit
  27.08., entdeckt 04.09.). Diese Action ist der eine Ort, an dem der Commit/PR-Weg
  für ALLE Agenten-Workflows steht.

  Token: Ein mit github.token erstellter PR löst KEINE pull_request-Workflows aus
  (GitHub-Rekursionsschutz) — die Pflicht-Checks (build-guard, content-gates) laufen
  dann nie, der PR bleibt unmergefähig. Deshalb bevorzugt diese Action das Secret
  BOT_PAT (fine-grained PAT, nur dieses Repo, Contents RW + Pull requests RW) und
  warnt sichtbar, wenn es fehlt.

inputs:
  pfade:
    description: 'Pfade, die committet werden (leerzeichengetrennt). NIE "." oder -A.'
    required: true
  branch-prefix:
    description: 'Präfix für den Branch, z. B. "bot/glossar" → bot/glossar-20260904-0300'
    required: true
  commit-message:
    description: 'Commit-Nachricht'
    required: true
  pr-titel:
    description: 'PR-Titel'
    required: true
  pr-body:
    description: 'PR-Beschreibung (Markdown)'
    required: false
    default: ''
  bot-name:
    description: 'git user.name'
    required: false
    default: 'steakakademie-bot'
  auto-merge:
    description: >
      "true" = PR mergt automatisch, sobald alle Pflicht-Checks grün sind (nur für
      reinen Text/Daten-Content ohne Review-Pflicht). "false" = wartet auf Uwe.
      Braucht das Repo-Setting "Allow auto-merge"; fehlt es, bleibt der PR offen.
    required: false
    default: 'false'
  token:
    description: 'BOT_PAT bevorzugt, github.token als Fallback (dann ohne Checks)'
    required: true

outputs:
  pr-url:
    description: 'URL des erstellten PRs (leer, wenn nichts zu committen war)'
    value: ${{ steps.pr.outputs.url }}
  anzahl:
    description: 'Anzahl geänderter Dateien'
    value: ${{ steps.commit.outputs.anzahl }}

runs:
  using: composite
  steps:
    - name: Änderungen prüfen + committen
      id: commit
      shell: bash
      env:
        PFADE: ${{ inputs.pfade }}
        PREFIX: ${{ inputs.branch-prefix }}
        MSG: ${{ inputs.commit-message }}
        BOT: ${{ inputs.bot-name }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        if [ -z "$(git status --porcelain -- $PFADE)" ]; then
          echo "anzahl=0" >> "$GITHUB_OUTPUT"
          echo "branch=" >> "$GITHUB_OUTPUT"
          echo "Keine Änderungen unter: $PFADE"
          exit 0
        fi
        # shellcheck disable=SC2086
        ANZAHL=$(git status --porcelain -- $PFADE | wc -l | tr -d ' ')
        BRANCH="${PREFIX}-$(date -u +%Y%m%d-%H%M)"
        git config user.name  "$BOT"
        git config user.email "actions@users.noreply.github.com"
        git checkout -b "$BRANCH"
        # shellcheck disable=SC2086
        git add -- $PFADE
        git commit -m "$MSG"
        echo "anzahl=$ANZAHL" >> "$GITHUB_OUTPUT"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

    - name: Branch pushen + PR öffnen
      id: pr
      if: steps.commit.outputs.anzahl != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ steps.commit.outputs.branch }}
        TITEL: ${{ inputs.pr-titel }}
        BODY: ${{ inputs.pr-body }}
        AUTO: ${{ inputs.auto-merge }}
        HAT_PAT: ${{ inputs.token != github.token }}
        LAUF_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        # Push mit dem übergebenen Token, damit der PR die Checks auslöst.
        git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

        # Ohne BOT_PAT ist der PR bestenfalls ungeprüft — und im Zweifel gar nicht da:
        # `gh pr create` mit github.token wird abgewiesen ("GitHub Actions is not
        # permitted to create or approve pull requests"), solange das Repo-Setting
        # "Allow GitHub Actions to create and approve pull requests" fehlt. Belegt im
        # ersten echten Testlauf (04.09.2026, ideen-radar, Run 33927566618). Die
        # folgende Warnung erreicht den PR-Text also nur, wenn dieses Setting steht.
        HINWEIS=""
        if [ "$HAT_PAT" != "true" ]; then
          HINWEIS=$'\n\n> ⚠️ **Ohne BOT_PAT erstellt** — die Pflicht-Checks (build-guard, content-gates) laufen auf diesem PR NICHT an (GitHub-Rekursionsschutz: ein von `github.token` erstellter PR löst keine `pull_request`-Workflows aus). Secret `BOT_PAT` anlegen (docs/ci-bot-pat.md) und den Lauf wiederholen; die Checks lassen sich sonst nur manuell per workflow_dispatch auf diesem Branch starten.'
        fi

        # RIEGEL (04.09.2026): Der Bot-Branch zweigt vom Checkout-Ref ab. Läuft der
        # Workflow per workflow_dispatch gegen einen Feature-Branch, enthält der PR
        # gegen main auch dessen Commits — Auto-Merge würde also fremde, ungeprüfte
        # Arbeit mitschleusen (aufgefallen beim geplanten Testlauf von glossary-grow
        # gegen fix/bot-pr-gate). Auto-Merge daher NUR, wenn der Lauf auf main basiert.
        FREMD=""
        if [ "$LAUF_REF" != "refs/heads/main" ]; then
          FREMD=$'\n\n> ⚠️ **Testlauf gegen `'"${LAUF_REF#refs/heads/}"$'`** — dieser PR enthält neben der Bot-Änderung auch die Commits dieses Branches gegenüber `main`. **Nicht mergen.** Er dient nur der Prüfung, ob PR-Erstellung und Pflicht-Checks funktionieren; danach schließen und den Branch löschen. Auto-Merge wurde für diesen Lauf automatisch abgeschaltet.'
          if [ "$AUTO" = "true" ]; then
            echo "::warning::Auto-Merge deaktiviert — Lauf basiert auf $LAUF_REF statt main; der PR enthaelt Fremd-Commits."
            AUTO=false
          fi
        fi

        # PR anlegen. Zwei bekannte Stolpersteine, wenn OHNE BOT_PAT gearbeitet wird:
        #   (a) Repo-Setting "Allow GitHub Actions to create and approve pull requests"
        #       (Settings -> Actions -> General) ist aus -> gh pr create scheitert hart.
        #   (b) Ist es an, entsteht der PR, aber der Rekursionsschutz laesst die
        #       Pflicht-Checks nicht anlaufen -> unmergefaehig.
        # Mit BOT_PAT tritt keiner von beiden Faellen auf. Der Commit liegt in jedem
        # Fall schon gepusht auf dem Branch — es geht nichts verloren.
        #
        # FEHLERPFAD (05.09.2026): `gh pr create` kann scheitern, und der Bot-Commit
        # liegt dann bereits gepusht auf $BRANCH. Ohne Behandlung sah der Operator nur
        # die rohe GraphQL-Meldung, das Job-Summary blieb leer (set -e bricht davor ab),
        # und der Branch blieb unauffindbar liegen — so passiert am 04.09. mit
        # bot/ideen-radar-20260904-2257. Der Branch wird bewusst NICHT geloescht: der
        # Commit ist echte Arbeit. Stattdessen wird er benannt, mit Aufraeum-Befehl.
        if ! URL=$(gh pr create --base main --head "$BRANCH" --title "$TITEL" --body "${BODY}${HINWEIS}${FREMD}" 2>&1); then
          MELDUNG="$URL"
          if printf '%s' "$MELDUNG" | grep -qF 'not permitted to create or approve pull requests'; then
            URSACHE='Actions duerfen in diesem Repo keine PRs anlegen. Entweder Secret BOT_PAT setzen (empfohlen, siehe docs/ci-bot-pat.md) oder Settings -> Actions -> General -> Workflow permissions -> "Allow GitHub Actions to create and approve pull requests" einschalten. Das ist NICHT "Actions bypass branch protection" — es erlaubt nur das Anlegen.'
          else
            URSACHE='gh pr create fehlgeschlagen — Rohmeldung im Job-Summary.'
          fi
          echo "::error::Kein PR geoeffnet — $URSACHE"
          {
            echo "## ❌ Kein PR geöffnet"
            echo ""
            echo "**Ursache:** $URSACHE"
            echo ""
            echo "**Der Commit ist nicht verloren** — er liegt gepusht auf \`$BRANCH\`."
            echo "Nach dem Beheben entweder den PR von Hand nachziehen:"
            echo ""
            echo '```'
            echo "gh pr create --base main --head $BRANCH"
            echo '```'
            echo ""
            echo "…oder den Branch verwerfen:"
            echo ""
            echo '```'
            echo "git push origin --delete $BRANCH"
            echo '```'
            echo ""
            echo "<details><summary>Rohmeldung</summary>"
            echo ""
            echo '```'
            echo "$MELDUNG"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "url=$URL" >> "$GITHUB_OUTPUT"

        if [ "$AUTO" = "true" ]; then
          gh pr merge "$URL" --auto --squash --delete-branch \
            || echo "::warning::Auto-Merge nicht möglich (Repo-Setting 'Allow auto-merge' fehlt?) — PR bleibt offen: $URL"
        fi

        {
          echo "## 🔀 PR geöffnet — kein Direct-Push auf main"
          echo "$URL"
          if [ "$AUTO" = "true" ]; then
            echo "Auto-Merge aktiv: mergt, sobald die Pflicht-Checks grün sind."
          else
            echo "Wartet auf Review (Regel 4 / 8c)."
          fi
          if [ -n "$FREMD" ]; then
            echo ""
            echo "⚠️ **Testlauf gegen \`${LAUF_REF#refs/heads/}\`** — PR enthält Fremd-Commits, Auto-Merge abgeschaltet. Nach der Prüfung schließen."
          fi
          if [ "$HAT_PAT" != "true" ]; then echo ""; echo "⚠️ **BOT_PAT fehlt** — Checks laufen nicht automatisch. Siehe docs/ci-bot-pat.md"; fi
        } >> "$GITHUB_STEP_SUMMARY"
