# Netlify-Konfiguration — Domain-Redirects
# SEO-Fix (Seobility factor_redirects, 03.07.2026):
# www.steakakademie.de lieferte 200 + identischen Inhalt statt 301 auf die
# non-www-Hauptdomain → Duplicate Content. Kanonischer Host = steakakademie.de
# (entspricht metadataBase in src/app/layout.tsx).

[[redirects]]
  from = "https://www.steakakademie.de/*"
  to = "https://steakakademie.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.steakakademie.de/*"
  to = "https://steakakademie.de/:splat"
  status = 301
  force = true
