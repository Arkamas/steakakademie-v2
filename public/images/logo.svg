<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 560 130" width="560" height="130" role="img" aria-label="Steakakademie">

  <!-- ░ Transparent background for header use -->

  <!-- ═══════════════════════════════════════════
       EMBLEM MARK — compact badge (left side)
       Rings + flame, no text, ~110x110 scaled to 110px
  ═══════════════════════════════════════════ -->
  <g transform="translate(2, 5) scale(0.228)">
    <!-- Rings -->
    <circle cx="250" cy="250" r="228" fill="none" stroke="#F5A623" stroke-width="10"/>
    <circle cx="250" cy="250" r="218" fill="none" stroke="#F5A623" stroke-width="3"/>
    <circle cx="250" cy="250" r="205" fill="none" stroke="#B43C00" stroke-width="6"/>
    <!-- Outer flame -->
    <path d="M 250,106 C 303,124 326,164 322,202 C 318,240 291,270 250,278
             C 209,270 182,240 178,202 C 174,164 197,124 250,106 Z"
          fill="#B43C00"/>
    <!-- Middle flame -->
    <path d="M 250,130 C 294,146 312,178 309,206 C 306,234 284,258 250,264
             C 216,258 194,234 191,206 C 188,178 206,146 250,130 Z"
          fill="#E8580A"/>
    <!-- Gold core -->
    <path d="M 250,156 C 276,167 288,188 286,210 C 284,228 269,244 250,248
             C 231,244 216,228 214,210 C 212,188 224,167 250,156 Z"
          fill="#F5A623"/>
  </g>

  <!-- ═══════════════════════════════════════════
       WORDMARK — right of emblem
  ═══════════════════════════════════════════ -->

  <!-- STEAK — large, bold, warm dark -->
  <text x="130" y="72"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-size="54" font-weight="700"
        fill="#120C07" letter-spacing="4">STEAK</text>

  <!-- Gold hairline separator -->
  <rect x="130" y="80" width="420" height="2" fill="#F5A623"/>

  <!-- AKADEMIE — spaced, lighter weight -->
  <text x="132" y="108"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-size="21" font-weight="400"
        fill="#120C07" letter-spacing="15">AKADEMIE</text>

</svg>
