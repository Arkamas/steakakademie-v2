name: Cut-Fotos generieren

# Manueller Knopf: generiert die freigestellten Cut-Fotos (Carneo-Look) für den
# Cut-Atlas / Cut-Generator mit FLUX.1 via fal.ai + hauseigenem sa_rawcut-LoRA.
# Nutzt das vorhandene GitHub-Secret FAL_KEY. Idempotent: erzeugt standardmäßig nur
# fehlende Bilder; "force" überschreibt vorhandene.
# Tipp: erst mit ein paar Test-Slugs (Feld "only") starten, dann alle.
#
# WICHTIG (seit 03.07.2026, Regel 4 human-gated + Lehre aus commit d6b4077):
# Committet NICHT mehr direkt auf main. Öffnet stattdessen einen Pull Request —
# Uwe prüft jedes generierte Bild gegen den behaupteten Cut (Regel 8c), BEVOR
# gemergt wird und der Deploy ausgelöst wird. Grund: ein direkter Push von 59
# anatomisch falschen Bildern ging vorher ungeprüft live.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Nur diese Slugs (kommagetrennt, z. B. "ribeye,tomahawk,schweinebauch"). Leer = ALLE fehlenden.'
        required: false
        default: ''
      force:
        description: 'Vorhandene Bilder überschreiben?'
        type: boolean
        required: false
        default: false

jobs:
  generate:
    name: Cut-Fotos generieren (FLUX.1, Carneo-Look)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review-Branch anlegen
        run: |
          BRANCH="cut-fotos/review-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Cut-Fotos generieren
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          echo "Starte: node scripts/cut-images.mjs $ARGS"
          node scripts/cut-images.mjs $ARGS

      - name: Geänderte Bilder committen + PR öffnen (KEIN direkter Push auf main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain public/images/cuts)" ]; then
            echo "## 🥩 Keine Bildänderungen" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          N=$(git status --porcelain public/images/cuts | grep -cE '\.jpg$' || true)
          git config user.name  "cut-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/cuts
          git commit -m "chore(cuts): ${N} Cut-Fotos generiert (FLUX, sa_rawcut-LoRA) — zur Prüfung"
          git push origin "$BRANCH"
          gh pr create \
            --title "🥩 ${N} neue Cut-Fotos — bitte gegen Cut-Anatomie prüfen (Regel 8c)" \
            --body "Automatisch generiert (F