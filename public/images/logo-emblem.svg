<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 500 500" width="500" height="500">

  <defs>
    <!-- Top arc: r=215, center 250/250 — STEAKAKADEMIE arches over the top -->
    <path id="arcTop" d="M 35,250 A 215,215 0 0,1 465,250"/>
    <!-- Bottom arc: same radius but CCW — tagline curves along bottom, reads L→R -->
    <path id="arcBottom" d="M 75,250 A 175,175 0 0,0 425,250"/>
  </defs>

  <!-- ░ Background -->
  <rect width="500" height="500" fill="#120C07"/>

  <!-- ═══════════════════════════════════════════
       THREE CONCENTRIC RINGS — badge border
  ═══════════════════════════════════════════ -->
  <!-- Outer gold ring -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="#F5A623" stroke-width="2.5"/>
  <!-- Second thin ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#F5A623" stroke-width="0.75"/>
  <!-- Inner fire ring -->
  <circle cx="250" cy="250" r="206" fill="none" stroke="#B43C00" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════
       TOP CURVED TEXT: ◆ STEAKAKADEMIE ◆
  ═══════════════════════════════════════════ -->
  <text font-family="Georgia, 'Palatino Linotype', serif"
        font-size="24" font-weight="700"
        fill="#F5A623" letter-spacing="6">
    <textPath xlink:href="#arcTop" href="#arcTop"
              startOffset="50%" text-anchor="middle">&#9670;  STEAKAKADEMIE  &#9670;</textPath>
  </text>

  <!-- ═══════════════════════════════════════════
       CENTRAL FLAME — clean symmetric teardrop
       Outer: deep fire red #B43C00
       Middle: amber orange #E8580A
       Core: gold #F5A623
  ═══════════════════════════════════════════ -->

  <!-- Outer flame — vertical tangent at apex = true pointed teardrop -->
  <path d="M 250,105
           C 250,107 322,155 326,200
           C 330,245 296,274 250,278
           C 204,274 170,245 174,200
           C 178,155 250,107 250,105 Z"
        fill="#B43C00"/>

  <!-- Middle flame -->
  <path d="M 250,129
           C 250,131 306,169 310,205
           C 314,236 290,260 250,265
           C 210,260 186,236 190,205
           C 194,169 250,131 250,129 Z"
        fill="#E8580A"/>

  <!-- Gold core — tight pointed oval -->
  <path d="M 250,155
           C 250,156 285,176 289,207
           C 293,230 274,248 250,251
           C 226,248 207,230 211,207
           C 215,176 250,156 250,155 Z"
        fill="#F5A623"/>

  <!-- ═══════════════════════════════════════════
       DIVIDER — arrow-flanked horizontal rule
  ═══════════════════════════════════════════ -->
  <line x1="96"  y1="297" x2="188" y2="297" stroke="#F5A623" stroke-width="1"/>
  <polygon points="194,293 205,297 194,301" fill="#F5A623"/>
  <polygon points="306,293 295,297 306,301" fill="#F5A623"/>
  <line x1="312" y1="297" x2="404" y2="297" stroke="#F5A623" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════
       FOUNDATION TEXT: EST. MMXXVI
  ═══════════════════════════════════════════ -->
  <text x="250" y="326"
        text-anchor="middle"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-size="13" fill="#C4A882" letter-spacing="5">EST. MMXXVI</text>

  <!-- ═══════════════════════════════════════════
       BOTTOM CURVED TAGLINE
  ═══════════════════════════════════════════ -->
  <text font-family="Georgia, 'Palatino Linotype', serif"
        font-size="12" fill="#6B5744" letter-spacing="3.5">
    <textPath xlink:href="#arcBottom" href="#arcBottom"
              startOffset="50%" text-anchor="middle">BBQ  &#183;  FLEISCH  &#183;  WISSEN</textPath>
  </text>

</svg>
