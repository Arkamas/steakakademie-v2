name: Bilder neu generieren

# Manueller Knopf: generiert Rezept-Hero-Bilder mit der AKTUELLEN Prompt-Doktrin
# NEU (--force überschreibt vorhandene). Nutzt das vorhandene GitHub-Secret FAL_KEY.
# Tipp: erst mit ein paar Test-Slugs starten (Feld "only"), dann alle.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Nur diese Slugs (kommagetrennt, z. B. "ribeye,brisket-texas"). Leer = ALLE Rezepte.'
        required: false
        default: ''

jobs:
  regenerate:
    name: Hero-Bilder neu generieren (FLUX.1 dev, --force)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Bilder generieren (--force)
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          ARGS="--force"
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          echo "Starte: node scripts/recipe-images.mjs $ARGS"
          node scripts/recipe-images.mjs $ARGS

      - name: Geänderte Bilder committen + pushen
        run: |
          if [ -z "$(git status --porcelain public/images/rezepte)" ]; then
            echo "## 🖼 Keine Bildänderungen" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          N=$(git status --porcelain public/images/rezepte | grep -cE '\.jpg$' || true)
          git config user.name  "recipe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/rezepte
          git commit -m "chore(rezepte): ${N} Hero-Bilder neu generiert (neue Prompt-Doktrin)"
          git push
          echo "## 🖼 ${N} Bilder neu generiert" >> $GITHUB_STEP_SUMMARY
          echo "Committet + gepusht → löst Deploy aus." >> $GITHUB_STEP_SUMMARY

      - name: Bei Fehler → Jira-Ticket (KAN)
        if: failure()
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Bild-Regenerierung fehlgeschlagen'
          ALERT_DESCRIPTION: 'Der manuelle Bild-Regenerierungs-Lauf (regenerate-recipe-images, FLUX) ist abgebrochen. Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-imageregen-failed'
        run: node scripts/ops-alert-to-jira.mjs
