name: Rezepte wachsen lassen

# Lässt die Rezept-Bibliothek im Hintergrund weiterwachsen: generiert neue Rezepte
# aus der Seed-Liste (scripts/recipe-agent.mjs), committet sie persistent (der
# Build-Lauf erzeugt sie sonst nur ephemer pro Deploy).
on:
  schedule:
    - cron: '30 3 * * *'   # Täglich 03:30 UTC (~30 Min nach dem Glossar-Lauf) — 1 Rezept/Tag
  workflow_dispatch:        # + manuell auslösbar

jobs:
  grow-recipes:
    name: Neue Rezepte generieren + committen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installieren
        run: npm ci --ignore-scripts

      - name: Rezept-Agent ausführen
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/recipe-agent.mjs --limit 1

      - name: Hero-Bilder generieren (FLUX.1 dev)
        if: steps.agent.outputs.seeds_exhausted != 'true'
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: node scripts/recipe-images.mjs

      - name: Neue Rezepte + Bilder committen + pushen
        run: |
          if [ -z "$(git status --porcelain content/rezepte public/images/rezepte)" ]; then
            echo "## 🍖 Rezepte" >> $GITHUB_STEP_SUMMARY
            echo "Keine neuen Rezepte — Seed-Liste unverändert/abgearbeitet." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          NEW=$(git status --porcelain content/rezepte | grep -cE '\.mdx$' || true)
          git config user.name  "recipe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/rezepte public/images/rezepte
          git commit -m "chore(rezepte): ${NEW} neue Rezepte + Hero-Bilder (automatisch)"
          git push
          echo "## 🍖 Rezept-Bibliothek gewachsen" >> $GITHUB_STEP_SUMMARY
          echo "**${NEW}** neue/aktualisierte Rezepte committet + gepusht → löst Deploy aus." >> $GITHUB_STEP_SUMMARY

      - name: Seed-Liste leer → Jira-Hinweis (KAN, dedup)
        if: steps.agent.outputs.seeds_exhausted == 'true'
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🌱 Rezept-Seed-Liste abgearbeitet — neue Cuts nachlegen'
          ALERT_DESCRIPTION: 'Der Rezept-Agent hat alle Seeds generiert; ohne neue Cuts in SEED_RECIPES (scripts/recipe-agent.mjs) entstehen keine neuen Rezepte mehr. Neue Premium-Cuts ergänzen, dann läuft die tägliche Generierung weiter.'
          ALERT_LABELS: 'ops,content,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Task'
          ALERT_DEDUP_LABEL: 'ops-recipe-seeds-empty'
        run: node scripts/ops-alert-to-jira.mjs

      - name: Bei Fehler → Jira-Ticket (KAN)
        if: failure()
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Rezept-Agent fehlgeschlagen'
          ALERT_DESCRIPTION: 'Der tägliche Rezept-Agent (recipe-grow, inkl. FLUX-Bilder) ist abgebrochen. Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-recipe-failed'
        run: node scripts/ops-alert-to-jira.mjs
