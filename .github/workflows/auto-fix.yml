# Auto-Fix-Agent — reagiert auf Issues mit Label "auto-fix"
# (erzeugt vom Mingma Post-Agent bei CODE_FIX-Ops-Alerts).
# Claude diagnostiziert das Issue und öffnet einen PR. Kein Direkt-Push auf main.
#
# EINMALIGE EINRICHTUNG:
#   1. Repo → Settings → Secrets and variables → Actions → New secret:
#        ANTHROPIC_API_KEY = sk-ant-…
#   2. Repo → Settings → Actions → General → Workflow permissions:
#        "Read and write permissions" + "Allow GitHub Actions to create pull requests" aktivieren
#   3. Label "auto-fix" existiert (legt der Post-Agent automatisch an, oder einmal manuell anlegen)

name: Auto-Fix Agent

on:
  issues:
    types: [labeled]

# Nur wenn genau das auto-fix-Label gesetzt wurde
jobs:
  fix:
    if: github.event.label.name == 'auto-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Branch anlegen
      pull-requests: write      # PR öffnen
      issues: write             # Issue kommentieren
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Claude — Fix vorbereiten
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude bekommt Titel + Body des Issues als Auftrag.
          prompt: |
            Ein automatischer Ops-Alert wurde als Issue gemeldet (Titel + Body unten).
            Aufgabe:
            1. Ursache im Code/Repo diagnostizieren (NICHT Konto-Einstellungen — die kann nur der Inhaber).
            2. Falls eine echte Code-Ursache existiert: minimalen, gezielten Fix umsetzen.
            3. Einen Pull Request gegen main öffnen mit kurzer Erklärung + Test-Hinweis.
            4. Falls die Ursache NICHT im Code liegt (z.B. fehlende Env-Variable, Konto-Einstellung):
               KEINEN Code ändern, sondern das Issue kommentieren mit den exakten manuellen Schritten.

            Issue: #${{ github.event.issue.number }}
            Titel: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

      - name: Bei Fehler → Jira-Ticket (KAN)
        if: failure()
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Auto-Fix-Agent fehlgeschlagen (Issue #${{ github.event.issue.number }})'
          ALERT_DESCRIPTION: 'Der Auto-Fix-Workflow für Issue #${{ github.event.issue.number }} ist abgebrochen. Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-autofix-failed'
        run: node scripts/ops-alert-to-jira.mjs
