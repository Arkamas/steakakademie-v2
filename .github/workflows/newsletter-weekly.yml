name: Weekly Newsletter

# WICHTIG (10.08.2026, Regel 4 „human-gated: Kein Auto-Posting"):
# Der wöchentliche Cron-Versand wurde ENTFERNT. Vorher ging KI-generierter Text
# jeden Freitag ungeprüft an ALLE Subscriber — das ist externe Veröffentlichung
# ohne Freigabe und damit ein direkter Regel-4-Verstoß (gleiche Fehlerklasse wie
# der ungeprüfte Cut-Foto-Push, Commit d6b4077).
#
# Neuer Ablauf (zweistufig, wie beim Cut-Foto-PR-Gate):
#   1. Lauf ohne "send" → erzeugt nur eine VORSCHAU im Job-Log/Summary.
#   2. Uwe liest die Vorschau, gibt frei → Lauf mit send=true versendet tatsächlich.
on:
  workflow_dispatch:
    inputs:
      send:
        description: 'WIRKLICH an alle Subscriber versenden? (leer lassen = nur Vorschau)'
        type: boolean
        required: false
        default: false

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Newsletter erzeugen (Vorschau oder Versand)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
          SEND_FLAG: ${{ inputs.send }}
        run: |
          if [ "$SEND_FLAG" = "true" ]; then
            echo "## 📧 Newsletter WIRD VERSENDET (Freigabe erteilt)" >> $GITHUB_STEP_SUMMARY
            node scripts/newsletter-weekly.mjs --send
          else
            echo "## 📋 Nur Vorschau — kein Versand" >> $GITHUB_STEP_SUMMARY
            echo "Inhalt im Job-Log prüfen. Zum Versenden diesen Workflow erneut mit **send = true** starten." >> $GITHUB_STEP_SUMMARY
            node scripts/newsletter-weekly.mjs
          fi

      - name: Bei Fehler → Jira-Ticket (KAN)
        if: failure()
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Newsletter-Lauf fehlgeschlagen'
          ALERT_DESCRIPTION: 'Der Newsletter-Lauf (newsletter-weekly) ist abgebrochen. Achtung: ggf. TEILWEISE versendet — Loops prüfen. Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,agent-marketing'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-newsletter-failed'
        run: node scripts/ops-alert-to-jira.mjs
