# ═══════════════════════════════════════════════════════════════════════════
# Ideen-Radar — alle 3 Tage zwei US-BBQ-Quellen nach Themen-Signalen abfragen.
#
# Laeuft an Monatstagen 1/4/7/... um 05:15 UTC — nach Glossar (03:00), Rezept
# (03:30) und Saison-Generator (04:30), damit die naechtlichen Laeufe sich
# nicht ins Gehege kommen.
#
# Was gesammelt wird: NUR Titel, Link, Datum, Kategorien aus dem RSS-Feed.
# Kein fremder Fliesstext, keine Zutatenlisten, keine Bilder. Das Ergebnis ist
# ein interner Themenspeicher (data/ideen-backlog.json), aus dem die
# bestehende Rezept- und Artikel-Pipeline Auftraege zieht — die schreibt dann
# aus Primaerquellen selbst. Begruendung und Quellenpruefung stehen im Kopf
# von data/rezept-quellen.yaml.
#
# Kein API-Schluessel noetig: das Skript ruft nur oeffentliche Feeds ab.
# Der Backlog wird zurueck ins Repo committet, damit die Entdopplung ueber
# Laeufe hinweg funktioniert — deshalb contents: write.
# ═══════════════════════════════════════════════════════════════════════════
name: ideen-radar

on:
  schedule:
    - cron: '15 5 */3 * *'
  workflow_dispatch:
    inputs:
      alle:
        description: 'Ausnahmsweise alle Quellen abfragen statt der Tagesrotation'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Ideen sammeln
        env:
          IN_ALLE: ${{ inputs.alle }}
        run: |
          if [ "$IN_ALLE" = "true" ]; then
            node scripts/ideen-radar.mjs --alle
          else
            node scripts/ideen-radar.mjs
          fi

      - name: Backlog als PR sichern (auto-merge nach grünen Gates)
        uses: ./.github/actions/pr-statt-push
        with:
          pfade: data/ideen-backlog.json
          branch-prefix: bot/ideen-radar
          bot-name: ideen-radar
          commit-message: 'chore(ideen): Radar-Lauf — Backlog aktualisiert'
          pr-titel: '📡 Ideen-Radar: Backlog aktualisiert'
          pr-body: 'Nur Titel/Link/Datum aus RSS (data/ideen-backlog.json). Interner Themenspeicher — mergt selbst nach grünen Gates.'
          auto-merge: 'true'
          token: ${{ secrets.BOT_PAT || github.token }}
