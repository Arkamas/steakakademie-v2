<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Platzhalterbild — noch kein Artikelbild hinterlegt">
  <!--
    Platzhalter fuer Artikel ohne eigenes Bild.

    Bewusst lokal und als SVG: Das image-Feld darf nicht auf einen fremden Host
    zeigen (kein Drittanbieter-Request ohne Einwilligung), und eine Vektordatei
    kostet ein paar hundert Byte statt eines Fotos.

    Wird ein Artikel veroeffentlicht, gehoert hier ein echtes Bild hin —
    der legal-guard prueft nur die Herkunft, nicht die Qualitaet.
  -->
  <rect width="1200" height="630" fill="#17100B"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#C8882A" stroke-opacity="0.35" stroke-width="2"/>
  <g fill="#C8882A" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="300" text-anchor="middle" font-size="46" font-weight="bold">Steakakademie</text>
    <text x="600" y="360" text-anchor="middle" font-size="22" fill="#C4A882" font-family="Helvetica, Arial, sans-serif" letter-spacing="3">PLATZHALTER — ARTIKELBILD FEHLT</text>
  </g>
</svg>
