# ═══════════════════════════════════════════════════════════════════════════
# Ideen-Quellen — steuert scripts/ideen-radar.mjs
#
# WAS HIER PASSIERT, UND WAS AUSDRÜCKLICH NICHT
#
# Der Radar liest aus den RSS-Feeds dieser Seiten AUSSCHLIESSLICH: Titel,
# Link, Datum, Kategorien. Er speichert keinen Fließtext, keine Zutatenlisten,
# keine Mengen, keine Bilder — auch dann nicht, wenn der Feed sie mitliefert.
# Das Ergebnis ist eine Ideen-Liste („dieses Gericht existiert"), kein Abzug.
#
# Gerichtenamen und Themen sind nicht schutzfähig; der ausformulierte Text,
# die Fotos und die Kuratierung einer Seite sehr wohl. Diese Grenze ist der
# ganze Sinn der Konstruktion: Aus einem Titel wird ein Auftrag an die eigene
# Rezept-Pipeline, die aus Primärquellen recherchiert, selbst formuliert,
# selbst umrechnet und eigene Bilder erzeugt (Regel 1, Regel 5).
#
# Wo eine Quelle den Anstoß gegeben hat, wird sie im fertigen Beitrag als
# Inspirationsquelle genannt und verlinkt. Das ist Anstand und zugleich das,
# was Kooperationen möglich macht.
#
# PRÜFSTAND 27.08.2026: robots.txt aller Quellen geprüft. Keine der acht
# gelisteten Seiten beschränkt KI- oder Allzweck-Crawler. Alle liefern
# /feed/ mit HTTP 200.
#
# AUSGESCHLOSSEN — bbqingwiththenolands.com
#   robots.txt sperrt ClaudeBot, GPTBot, anthropic-ai, CCBot, Google-Extended,
#   Bytespider, Amazonbot, Applebot-Extended und meta-externalagent mit
#   Disallow: /. Ein ausdrückliches Opt-out wird respektiert — unsere eigene
#   robots.txt lädt dieselben Crawler ein, wir können nicht zweierlei Maß
#   anlegen. Nicht wieder aufnehmen ohne schriftliche Erlaubnis.
#
# AUSGESCHLOSSEN — usa-kulinarisch.de
#   Impressum untersagt die Nutzung durch kommerzielle Portale ausdrücklich
#   („Dadurch betrachte ich meine Urheberrechte als verletzt"). Erlaubt nur
#   nach Rücksprache per Mail. Solange die nicht vorliegt: draußen.
#
# ROTATION
#   Zwei Quellen je Lauf, deterministisch aus dem Tag im Jahr:
#     Slot A — Grundrotation: quellen[tagImJahr % anzahl]. Garantiert, dass
#              jede Quelle im Abstand von acht Läufen drankommt.
#     Slot B — Saison-Slot: aus den Quellen, deren `saison` das gerade aktive
#              Fenster aus data/saison-kalender.yaml enthält, wieder per
#              tagImJahr rotierend. So kommt im November die Feiertagsküche
#              nach oben und im Juni die Grillsaison.
#   Fällt B auf dieselbe Quelle wie A, rückt B eine Position weiter.
#   Kein Zustand, keine Datei, die verrutschen kann — derselbe Tag ergibt
#   immer dieselbe Auswahl.
# ═══════════════════════════════════════════════════════════════════════════

meta:
  geprueft: "2026-08-27"
  user_agent: "SteakakademieIdeenRadar/1.0 (+https://steakakademie.de/impressum)"
  # Nur diese Felder dürfen den Radar verlassen. Alles andere wird verworfen.
  erlaubte_felder: [titel, link, datum, kategorien]
  max_pro_quelle: 15      # Titel je Lauf und Quelle — Ideen sammeln, nicht absaugen
  crawl_delay_ms: 2000    # freiwillig, deutlich langsamer als nötig

