name: Schwein-LoRA trainieren

# Manueller Knopf: trainiert einen hauseigenen FLUX-LoRA für Schwein (blass-rosa,
# geschichtet) aus kuratierten Cut-Fotos und schreibt scripts/pork-lora.json.
# Danach rendert scripts/cut-images.mjs Schwein nativ über diesen LoRA.
# Nutzt das GitHub-Secret FAL_KEY. Kosten ~3–5 €, Dauer ~15–30 Min.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Trainings-Steps (Default 1200)'
        required: false
        default: '1200'

jobs:
  train:
    name: FLUX Schwein-LoRA trainieren
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installieren
        run: |
          npm ci --ignore-scripts
          npm i @fal-ai/client --no-save

      - name: Dataset vorhanden? (Guard, 04.09.2026)
        # training/lora-pork/dataset/ ist gitignored und liegt im Repo NICHT vor —
        # ohne Bilder bricht train-pork-lora.mjs mit Exit 1 ab und erzeugt ein
        # Jira-Ticket, obwohl nichts kaputt ist. Deshalb: früh und lesbar stoppen.
        run: |
          N=$(find training/lora-pork/dataset -maxdepth 1 -iname '*.jpg' 2>/dev/null | wc -l)
          if [ "$N" -lt 10 ]; then
            {
              echo "## 🐷 Kein Training — Dataset fehlt"
              echo "training/lora-pork/dataset/ enthält $N Bilder (mind. 10 nötig)."
              echo "Das Dataset ist gitignored; der Workflow kann nur laufen, wenn die Bilder vorher"
              echo "in einem Branch committet oder als Artifact bereitgestellt werden."
              echo "Siehe training/lora-pork/README.md. Kein Fehler, kein Jira-Ticket."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Dataset fehlt ($N Bilder) — Training übersprungen"
            exit 0
          fi
          echo "$N Bilder gefunden — Training startet"
          echo "TRAIN=1" >> "$GITHUB_ENV"

      - name: LoRA trainieren
        if: env.TRAIN == '1'
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PORK_STEPS: ${{ inputs.steps }}
        run: node scripts/train-pork-lora.mjs

      - name: pork-lora.json als PR (auto-merge nach grünen Gates)
        if: env.TRAIN == '1'
        uses: ./.github/actions/pr-statt-push
        with:
          pfade: scripts/pork-lora.json
          branch-prefix: bot/pork-lora
          bot-name: lora-bot
          commit-message: 'chore(lora): Schwein-LoRA trainiert (pork-lora.json)'
          pr-titel: '🐷 Schwein-LoRA neu trainiert'
          pr-body: 'Neue LoRA-Weights-URL aus fal.ai-Training. Nur eine JSON-Konfiguration — mergt selbst nach grünen Gates.'
          auto-merge: 'true'
          token: ${{ secrets.BOT_PAT || github.token }}

      - name: Bei Fehler → Jira-Ticket (KAN)
        if: failure()
        env:
          JIRA_BASE_URL: https://steakakademie.atlassian.net
          JIRA_PROJECT_KEY: KAN
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALERT_SUMMARY: '🔴 Schwein-LoRA-Training fehlgeschlagen'
          ALERT_DESCRIPTION: 'train-pork-lora ist abgebrochen. Run-Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ALERT_LABELS: 'ops,ci,agent-tech-automation-engineer'
          ALERT_ISSUETYPE: 'Bug'
          ALERT_DEDUP_LABEL: 'ops-porklora-failed'
        run: node scripts/ops-alert-to-jira.mjs
